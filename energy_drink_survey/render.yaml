services:
  - type: web
    name: energy-drink-survey
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: energy-drink-survey-db
          property: connectionString

databases:
  - name: energy-drink-survey-db
    plan: free
